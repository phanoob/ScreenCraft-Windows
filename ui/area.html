<!doctype html>
<html><head><meta charset="utf-8" /><title>Select area</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: rgba(0,0,0,.35); cursor: crosshair; font: 12px -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #sel { position: fixed; border: 2px dashed #6aaee8; border-radius: 3px; background: rgba(0,0,0,0); box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); display: none; }
  #lab { position: fixed; padding: 3px 8px; background: #3b82c4; color: #fff; border-radius: 4px; display: none; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #0f1520; color: #e5eaf4; padding: 8px 14px; border-radius: 8px; border: 1px solid #2a374d; border-left: 3px solid #3b82c4; }
</style></head>
<body>
<div id="hint">Drag to select the area to record · Esc to cancel</div>
<div id="sel"></div><div id="lab"></div>
<script type="module" src="js/i18n.js"></script>
<script type="module" src="js/area.js"></script>
</body></html>
