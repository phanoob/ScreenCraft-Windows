<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>menu</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html, body { overflow: hidden; background: transparent; }
  #card {
    display: inline-block; min-width: 300px; max-width: 420px; max-height: 520px; overflow: auto;
    background: #0d131e; border: 1px solid var(--line-2); border-radius: 11px; padding: 6px;
  }
  button { white-space: nowrap; display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 7px; color: #d5dcec; }
  button:hover { background: rgba(255,255,255,.07); }
  .chk { display: inline-block; width: 16px; color: var(--accent-2); }
  .small { color: var(--muted); font-size: 11px; margin-left: 16px; }
  .hd { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 10px 3px; }
</style>
</head>
<body>
<div id="card"></div>
<script type="module" src="js/i18n.js"></script>
<script type="module" src="js/menu.js"></script>
</body>
</html>
